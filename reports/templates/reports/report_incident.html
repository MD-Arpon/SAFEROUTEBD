{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3 text-teal">Report an Incident</h2>
    
    <div class="row">
        <!-- Map Section -->
        <div class="col-md-7 mb-4">
            <div class="card shadow-sm">
                <div class="card-body p-2">
                    <div id="map" style="height: 480px; width: 100%; border-radius: 8px;"></div>
                </div>
            </div>
            <small class="text-muted mt-2 d-block">* Click on the map to automatically set Latitude & Longitude.</small>
        </div>

        <!-- Form Section -->
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {{ form.as_p }}

                        <button type="submit" class="btn btn-teal w-100 mt-3">Submit Incident Report</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Heatmap Plugin Plugin CDN -->
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Default View: Dhaka Location
        var map = L.map('map').setView([23.8103, 90.4125], 12);

        // Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Render Heatmap from Django Context Data
        var heatPoints = {{ heat_data_json|safe }};
        if (heatPoints && heatPoints.length > 0) {
            L.heatLayer(heatPoints, {
                radius: 25,
                blur: 15,
                maxZoom: 17,
                gradient: {0.4: 'blue', 0.65: 'lime', 1: 'red'}
            }).addTo(map);
        }

        // Click Event: Click to Set Lat/Long in Form Inputs
        var currentMarker;
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            // Fill Django Hidden or Text Inputs if present
            var latInput = document.getElementById('id_latitude');
            var lngInput = document.getElementById('id_longitude');

            if (latInput && lngInput) {
                latInput.value = lat.toFixed(6);
                lngInput.value = lng.toFixed(6);
            }

            // Remove existing temporary marker and add new one
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            currentMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup("Selected Incident Location")
                .openPopup();
        });
    });
</script>
{% endblock %}
